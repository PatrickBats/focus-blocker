<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time to focus — Focus Blocker</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <div class="art"><img src="assets/working-cat.png" alt="A determined little orange cat in a cozy sweater, working hard at a laptop." width="1254" height="1254"></div>
    <div class="content">
      <p class="eyebrow"><span class="dot"></span> FOCUS BLOCKER</p>
      <h1 id="heading">You’ve got work.<br>So does this cat.</h1>
      <p class="intro" id="intro">One thing at a time. Your distractions can wait.</p>
      <div class="timer-panel">
        <p id="until" role="status">Checking your schedule…</p>
        <div id="countdown" role="timer" aria-label="Time remaining until unlock">—</div>
        <p class="timer-note" id="timer-note">A little space to do your thing.</p>
      </div>
      <div id="health" role="alert" hidden><p id="health-text"></p><button id="retry">Retry</button></div>
      <button id="settings" class="settings">Schedule &amp; settings <span aria-hidden="true">↗</span></button>
      <p class="footnote">Small steps. Very serious paws.</p>
    </div>
  </main>
  <script src="common.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
