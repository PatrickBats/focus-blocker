<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="status" class="status">
    <span id="status-icon"></span>
    <span id="status-text">Loading…</span>
  </div>

  <form id="add-form">
    <input id="add-input" type="text" placeholder="Block a site… e.g. reddit.com" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <div id="add-error" class="error" hidden></div>

  <ul id="site-list"></ul>
  <div id="empty" class="empty" hidden>No sites blocked yet. Add one above.</div>

  <div class="footer">
    <a href="#" id="open-options">Schedule &amp; settings</a>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
