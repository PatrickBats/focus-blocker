<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Focus Blocker</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Focus Blocker</h1>
  <div id="status" class="status" role="status">Checking blocking…</div>
  <div id="health" class="message err" role="alert" hidden><span id="health-text"></span> <button id="retry">Retry</button></div>
  <button id="block-current" disabled>Block this site</button>
  <p id="current-domain" class="muted"></p>
  <form id="add-form">
    <label class="sr-only" for="add-input">Website to block</label>
    <input id="add-input" type="text" placeholder="e.g. reddit.com" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
  <div id="message" class="message" role="status" hidden></div>
  <ul id="site-list"></ul>
  <p id="empty" class="muted" hidden>No sites blocked yet.</p>
  <div class="footer"><a href="#" id="open-options">Schedule &amp; settings ↗</a></div>
  <script src="core.js"></script><script src="common.js"></script><script src="popup.js"></script>
</body>
</html>
